\n• Raamatu põhjal on loodud ka populaarne lauamäng ja teatrilavastusi.","summary":"Lugu jälgib Leemetit, kes on viimane mees, kes oskab veel iidset ussisõnade keelt – keelt, mille abil saab suhelda metsloomadega ja panna nad kuuletuma. Tegevus toimub ajal, mil muistsed eestlased hakkavad üha enam metsast välja külla kolima.\n\nKülas võetakse omaks võõramaalaste kombed, hakatakse põldu harima, leiba sööma ja võõrast jumalat kummardama, unustades vanad metsatarkused. Leemet peab pealt vaatama, kuidas tema tuttav maailm ja lähedased tasapisi hääbuvad, püüdes ise jääda truuks oma juurtele.","characters":"• Leemet – loo peategelane ja jutustaja. Ta on tähelepanelik, veidi melanhoolne ja põikpäine noormees, kes ei suuda ega taha uue külaeluga kohaneda. Raamatu jooksul kasvab ta poisikesest üksildaseks, kuid väärikaks vana maailma hoidjaks.\n• Ints – rästik ja Leemeti parim lapsepõlvesõber. Ints on lojaalne, otsekohene ja tark uss, kes kehastab muistse metsa vabadust.\n• Vootele – Leemeti onu, kes õpetab talle ussisõnu ja vanu tarkusi.\n• Hiie – Leemeti esimene armastus, kes esindab puhast ja rikkumatut metsarahva hinge.\n• Johannes – külavanem, kes ihaldab kõike võõramaist ja peab metsarahvast mahajäänuks.","setting":"Tegevus toimub muistses Eestis, umbes 13. sajandil üleminekuajal, mil muinasaeg hakkab lõppema ja algab keskaeg. Vastanduvad kaks maailma: ühelt poolt sügav, salapärane ja vaba ürgmets ning teiselt poolt piiratud ja reeglitega külaühiskond.","conflict":"Romaani keskne konflikt on vana ja uue maailmavaate kokkupõrge: looduslähedane, vaba ja traditsioone hoidev metsaelu versus moodne, kuid oma juured unustanud külaühiskond. Sisemiselt vaevab Leemetit üksindus ja küsimus, kas tasub hoida kinni keelest ja kultuurist, mida keegi teine enam ei vaja.","message":"Autor juhib tähelepanu sellele, kui kergesti võivad inimesed oma keele, kultuuri ja loodustunnetuse unustada, kui nad hakkavad pimesi jäljendama kõike uut ja „moodsat“. Raamat paneb mõtlema rahvusliku identiteedi, loodusega kooskõlas elamise ja oma juurte väärtustamise üle.","memorable":"Kõige meeldejäävam ja üllatavam oli stseen, kus Leemet kohtub vana ja hiiglasliku Põhja Konnaga, kes magab sügavas koopas ja ootab, et teda äratataks maad kaitsma. Kurb, kuid võimas oli tõdemus, et koletise äratamiseks on vaja tuhandete ussisõnade oskajate ühist häält, kuid neid inimesi ei ole enam alles.","quote":"„Inimesed on nagu tuulelipud – puhub tuul ühest suunast, keeravad end sinna, puhub teisest, pööravad ümber, ilma et ise arugi saaksid, miks nad just nii seisavad.“","opinion":"Mulle meeldis raamat väga, sest see ühendab oskuslikult fantaasia, musta huumori ja sügava filosoofilise mõtte. Kivirähki stiil on kaasahaarav ja värvikas – kohati ajab naerma, aga raamatu lõpupoole muutub toon üsna kurvaks ja mõtlemapanevaks. Alguses võttis veidi harjumist, et tegelased on väga grotesksed, kuid just see muudabki raamatu nii eriliseks.","recommendation":"Soovitan seda raamatut kindlasti gümnaasiumiõpilastele ja kõigile, kellele meeldivad fantaasiarikkad, teravmeelsed ja Eesti ajaloo ning mütoloogiaga põimitud lood. See on teos, mis jääb pikaks ajaks kummitama."}},{"id":1,"readerName":"Aliise Kink","title":"","author":"","genre":"","year":"","pages":"","coverUrl":"","presetTheme":"terracotta","rating":8,"sections":{"author":"","summary":"","characters":"","setting":"","conflict":"","message":"","memorable":"","quote":"","opinion":"","recommendation":""}},{"id":2,"readerName":"Matthias Lai","title":"","author":"","genre":"","year":"","pages":"","coverUrl":"","presetTheme":"slate","rating":8,"sections":{"author":"","summary":"","characters":"","setting":"","conflict":"","message":"","memorable":"","quote":"","opinion":"","recommendation":""}},{"id":3,"readerName":"Kaspar Kurvits","title":"","author":"","genre":"","year":"","pages":"","coverUrl":"","presetTheme":"amber","rating":8,"sections":{"author":"","summary":"","characters":"","setting":"","conflict":"","message":"","memorable":"",         function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function coverHTML(book) {
            if (book.coverUrl && book.coverUrl.trim()) {
                return '<div class="relative w-full aspect-[3/4] bg-stone-200 overflow-hidden"><img src="' + esc(book.coverUrl) + '" class="w-full h-full object-cover"></div>';

            if (book.presetTheme === 'ussisõnad' || (book.title && book.title.toLowerCase().includes('ussisõnu'))) {

            }
            const colors = ['bg-[#1E3F35]','bg-[#8C4332]','bg-[#263545]','bg-[#5C4328]'];
            return '<div class="relative w-full aspect-[3/4] ' + colors[book.id % 4] + ' text-paper p-5 flex flex-col justify-between text-center"><div class="text-[11px] uppercase tracking-widest opacity-80">' + esc(book.author || 'Autor') + '</div><div class="font-serif font-bold text-xl my-auto">' + esc(book.title || 'Raamat') + '</div><div class="text-[10px] uppercase tracking-widest opacity-70">' + esc(book.genre || 'Raamatublogi') + '</div></div>';
        }
        function fmt(t) {
            if (!t || !t.trim()) return '<p class="text-stone-400 italic">Sisu lisamata.</p>';
            return t.split('\n').filter(x => x.trim()).map(x => '<p class="mb-3 leading-relaxed">' + esc(x) + '</p>').join('');
        }
        function showHome() {
            document.getElementById('nav-home-btn').classList.add('hidden');
            const root = document.getElementById('root');
            root.innerHTML = '<div class="text-center max-w-2xl mx-auto mb-10"><h1 class="font-serif text-3xl sm:text-5xl font-bold text-forest mb-3">' + esc(BLOG_DATA.blogTitle) + '</h1><p class="text-muted text-lg">' + esc(BLOG_DATA.blogSubtitle) + '</p></div>' +
            '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">' +
            BLOG_DATA.books.map((b, i) => '<div onclick="showBook(' + i + ')" class="book-card cursor-pointer bg-white rounded-2xl border border-stone-200 overflow-hidden shadow-xs flex flex-col"><div class="relative">' + coverHTML(b) + '<div class="absolute top-3 right-3 bg-white/95 font-bold text-xs px-2.5 py-1 rounded-full shadow-xs"><span class="text-amber-500">★</span> ' + b.rating + '/10</div></div><div class="p-4 flex-1 flex flex-col justify-between"><div><div class="text-xs font-semibold text-terracotta mb-1">Lugeja: ' + esc(b.readerName) + '</div><h2 class="font-serif font-bold text-base text-ink">' + esc(b.title || 'Raamat #' + (i+1)) + '</h2><p class="text-xs text-muted mt-0.5">' + esc(b.author) + '</p></div><div class="pt-3 mt-3 border-t border-stone-100 text-xs font-semibold text-forest">Loe postitust →</div></div></div>').join('') +
            '</div>';
            window.scrollTo({top:0, behavior:'smooth'});
        }
        function showBook(i) {
            document.getElementById('nav-home-btn').classList.remove('hidden');
            const b = BLOG_DATA.books[i];
            const s = b.sections;
            const pts = [
                ['02', 'Autor', s.author],
                ['03', 'Sisukokkuvõte', s.summary],
                ['04', 'Tegelased', s.characters],
                ['05', 'Tegevusaeg ja -koht', s.setting],
                ['06', 'Põhiprobleem', s.conflict],
                ['07', 'Raamatu sõnum', s.message],
                ['08', 'Meeldejääv koht', s.memorable],
                ['09', 'Isiklik arvamus', s.opinion]
            ];
            let stars = '';
            for (let k = 1; k <= 10; k++) stars += '<span class="' + (k <= b.rating ? 'text-amber-400' : 'text-stone-300') + ' text-2xl">★</span>';
            document.getElementById('root').innerHTML = '<div class="max-w-4xl mx-auto"><button onclick="showHome()" class="mb-6 bg-white hover:bg-cream text-forest border border-stone-200 px-4 py-2 rounded-xl text-sm font-medium cursor-pointer">← Tagasi avalehele</button>' +
            '<article class="bg-white rounded-3xl border border-stone-200 overflow-hidden shadow-sm"><div class="bg-forest text-paper p-6 sm:p-10 flex flex-col md:flex-row gap-8 items-center md:items-start"><div class="w-48 shrink-0 rounded-2xl overflow-hidden shadow-lg">' + coverHTML(b) + '</div><div class="flex-1 text-center md:text-left"><div class="inline-block bg-white/10 text-amber-200 text-xs font-semibold px-3 py-1 rounded-full mb-3">Lugeja: ' + esc(b.readerName) + '</div><h1 class="font-serif text-3xl sm:text-4xl font-bold text-white mb-2">' + esc(b.title) + '</h1><p class="font-serif italic text-lg text-stone-200 mb-6">' + esc(b.author) + '</p><div class="grid grid-cols-3 gap-3 bg-forest-dark/70 rounded-2xl p-4 text-left text-sm"><div><span class="block text-xs text-stone-400">Žanr</span>' + esc(b.genre || '—') + '</div><div><span class="block text-xs text-stone-400">Ilmumisaasta</span>' + esc(b.year || '—') + '</div><div><span class="block text-xs text-stone-400">Lehekülgi</span>' + esc(b.pages ? b.pages + ' lk' : '—') + '</div></div></div></div>' +
            '<div class="p-6 sm:p-10 space-y-8">' + pts.map(p => '<section class="pb-6 border-b border-stone-100"><span class="text-xs font-bold text-terracotta uppercase">' + p[0] + '. Punkt</span><h2 class="font-serif text-2xl font-bold text-forest mb-3">' + p[1] + '</h2>' + fmt(p[2]) + (p[0] === '08' && s.quote ? '<blockquote class="mt-4 bg-paper border-l-4 border-terracotta p-4 rounded-r-xl font-serif italic">' + esc(s.quote) + '</blockquote>' : '') + '</section>').join('') +
            '<section class="bg-paper rounded-2xl p-6 border border-stone-200"><div class="flex justify-between items-center mb-3"><h2 class="font-serif text-2xl font-bold text-forest">10. Hinnang ja soovitus</h2><span class="font-serif font-bold text-xl text-forest">' + b.rating + '/10</span></div><div class="mb-3">' + stars + '</div>' + fmt(s.recommendation) + '</section></div></article></div>';
            window.scrollTo({top:0, behavior:'smooth'});
        }
        showHome();
    </script>
</body>
</html>
